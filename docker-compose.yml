services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monitoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/monitoring_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres_dev_pw}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-please-32bytes}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-43200000}
      MASTER_KEY: ${MASTER_KEY:-dev-only-master-key-change-me}
      HMAC_WINDOW_SECONDS: ${HMAC_WINDOW_SECONDS:-300}
      TWO_FA_ENABLED: ${TWO_FA_ENABLED:-false}
      METRICS_FETCH_POLL_INTERVAL_MS: ${METRICS_FETCH_POLL_INTERVAL_MS:-300}
      METRICS_FETCH_POLL_MAX_ATTEMPTS: ${METRICS_FETCH_POLL_MAX_ATTEMPTS:-26}
      METRICS_FETCH_TIMEOUT_MINUTES: ${METRICS_FETCH_TIMEOUT_MINUTES:-2}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@monitoring.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      APP_STORAGE_ROOT: /data01
      APP_INGEST_BASE_URL: ${APP_INGEST_BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      MAIL_FROM: ${MAIL_FROM:-monitoring-noreply@example.com}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:1.5b}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-5}
      OLLAMA_READ_TIMEOUT_SECONDS: ${OLLAMA_READ_TIMEOUT_SECONDS:-45}
      AIOPS_SCAN_INTERVAL_MS: ${AIOPS_SCAN_INTERVAL_MS:-300000}
      AIOPS_CRITICAL_CPU_THRESHOLD: ${AIOPS_CRITICAL_CPU_THRESHOLD:-90}
      AIOPS_CRITICAL_RAM_THRESHOLD: ${AIOPS_CRITICAL_RAM_THRESHOLD:-90}
      AIOPS_CRITICAL_DISK_THRESHOLD: ${AIOPS_CRITICAL_DISK_THRESHOLD:-90}
    volumes:
      - app_data:/data01

volumes:
  pg_data:
  app_data:

# ==========================================
# Sunucu
# ==========================================
server.port=${SERVER_PORT:8080}

# ==========================================
# PostgreSQL Baglantisi
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monitoring_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate - Flyway owns the schema now
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# Jackson (JSON tarih formati)
# ==========================================
spring.jackson.time-zone=Europe/Istanbul

# ==========================================
# JWT
# No committed fallback on purpose - this used to be a real-looking default
# secret baked into a file that lives in version control. Set JWT_SECRET in
# .env (or the systemd EnvironmentFile) for every real deployment; the
# placeholder below only exists so a plain `mvn spring-boot:run` without any
# env still boots for local development.
# ==========================================
app.jwt.secret=${JWT_SECRET:CHANGE_ME_dev_only_jwt_secret_min_32_bytes_please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

# ==========================================
# AES-256-GCM master key for encrypting the per-server HMAC secret at rest.
# Must decode (Base64) to exactly 32 bytes. Set MASTER_KEY in .env for every
# real deployment - see note above.
# ==========================================
app.security.master-key=${MASTER_KEY:CHANGE_ME_dev_only_master_key_placeholder}

# ==========================================
# HMAC ingestion anti-replay window (seconds)
# ==========================================
app.security.hmac-window-seconds=${HMAC_WINDOW_SECONDS:300}

# ==========================================
# Email-based 2FA kill-switch. Defaults OFF again - mail delivery timed out
# on first live test (2026-08-17, Read timed out talking to
# smtp.turkcell.com.tr:25) so 2FA login must stay off until delivery is
# proven end-to-end. Flip TWO_FA_ENABLED=true once verified.
# ==========================================
app.security.2fa-enabled=${TWO_FA_ENABLED:false}

# ==========================================
# "Fetch Now" bounded poll: how long the HTTP caller waits for the agent's
# next heartbeat to report a result before falling back to a pollable 202.
# ~26 x 300ms = ~8s by default. Sweep marks anything still PENDING after
# fetch-timeout-minutes as TIMED_OUT so a dead agent never leaves a row stuck.
# ==========================================
app.metrics.fetch-poll-interval-ms=${METRICS_FETCH_POLL_INTERVAL_MS:300}
app.metrics.fetch-poll-max-attempts=${METRICS_FETCH_POLL_MAX_ATTEMPTS:26}
app.metrics.fetch-timeout-minutes=${METRICS_FETCH_TIMEOUT_MINUTES:2}

# ==========================================
# Bootstrap admin (seeded once on first boot if no ADMIN exists yet)
# CHANGE the default password immediately after first login.
# ==========================================
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:admin@monitoring.local}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}

# ==========================================
# Storage root for provisioning artifacts (agent.py template, generated unit files)
# ==========================================
app.storage.root=${APP_STORAGE_ROOT:/data01}

# ==========================================
# Base URL this Spring Boot instance is reachable at from provisioned agents.
# MUST be overridden to the real host/IP for anything beyond localhost testing.
# ==========================================
app.ingest-base-url=${APP_INGEST_BASE_URL:http://localhost:8080}

# ==========================================
# SMTP mail (2FA OTP delivery + async system alerts)
# app.mail.enabled=false lets the app run with no SMTP server reachable -
# EmailService no-ops instead of blocking/failing the calling transaction.
# spring.mail.host has no committed real default on purpose - set SMTP_HOST
# in .env / the systemd EnvironmentFile to the corporate relay for this
# environment (ehlo + starttls, no auth is the proven-working combo here).
# ==========================================
spring.mail.host=${SMTP_HOST:smtp.example.com}
spring.mail.port=25
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.properties.mail.debug=true

app.mail.from=${MAIL_FROM:monitoring-noreply@example.com}
app.mail.enabled=${MAIL_ENABLED:true}

# ==========================================
# AIOps modulu - yerel Ollama LLM entegrasyonu.
# app.ollama.base-url Ollama'nin ayni makinede varsayilan portunda calistigi
# varsayimiyla ayarlanmistir; Ollama kapaliysa/erisilemezse zamanlanmis
# gorevler ve /chat uc noktasi kontrollu sekilde hata dondurur (bkz.
# OllamaUnavailableException), frontend de bu durumda yerel bir mock yanita
# duser (assets/aiops.js).
# ==========================================
app.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.ollama.model=${OLLAMA_MODEL:qwen2.5-coder:1.5b}
app.ollama.connect-timeout-seconds=${OLLAMA_CONNECT_TIMEOUT_SECONDS:5}
app.ollama.read-timeout-seconds=${OLLAMA_READ_TIMEOUT_SECONDS:45}

# AIOpsScheduler.periodicScan araligi (ms) ve kritik esik nobetcisi sinirlari (%)
app.aiops.scan-interval-ms=${AIOPS_SCAN_INTERVAL_MS:300000}
app.aiops.critical-cpu-threshold=${AIOPS_CRITICAL_CPU_THRESHOLD:90}
app.aiops.critical-ram-threshold=${AIOPS_CRITICAL_RAM_THRESHOLD:90}
app.aiops.critical-disk-threshold=${AIOPS_CRITICAL_DISK_THRESHOLD:90}

# ==========================================
# Logging - append mode avoids file-lock/descriptor issues on restart
# ==========================================
logging.file.name=${APP_STORAGE_ROOT:/data01}/spring.log
logging.logback.rollingpolicy.file-name-pattern=${APP_STORAGE_ROOT:/data01}/spring.%d{yyyy-MM-dd}.%i.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

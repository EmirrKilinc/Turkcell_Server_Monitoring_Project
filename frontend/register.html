<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayit Ol - Sistem Izleme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/app.css" rel="stylesheet">
</head>
<body>
<div class="auth-shell w-100">
<div class="card auth-card">
    <div class="card-body p-4">
        <h1 class="h4 mb-3"><i class="bi bi-person-plus text-primary"></i> Hesap Olustur</h1>
        <p class="text-muted mb-4">Kayit sonrasi bir admin onayi beklenecektir.</p>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="username" class="form-label">Kullanici Adi</label>
                <input type="text" class="form-control" id="username" minlength="3" required autofocus>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">E-posta</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Sifre</label>
                <input type="password" class="form-control" id="password" minlength="8" required>
                <div class="form-text">En az 8 karakter.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Kayit Ol</button>
        </form>

        <p class="text-center mt-3 mb-0">
            Zaten hesabiniz var mi? <a href="login.html">Giris yapin</a>
        </p>
    </div>
</div>
</div>

<script src="assets/auth.js"></script>
<script>
    if (isLoggedIn()) {
        window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none', 'alert-danger', 'alert-success');

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(apiUrl('/api/auth/register'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password }),
            });

            if (response.status === 201) {
                alertBox.textContent = 'Hesabiniz olusturuldu. Bir admin onayladiktan sonra giris yapabilirsiniz.';
                alertBox.classList.remove('d-none');
                alertBox.classList.add('alert-success');
                form.reset();
                return;
            }

            const data = await response.json().catch(() => ({}));
            alertBox.textContent = data.error || 'Kayit basarisiz';
            alertBox.classList.remove('d-none');
            alertBox.classList.add('alert-danger');
        } catch (err) {
            alertBox.textContent = 'Sunucuya baglanilamadi';
            alertBox.classList.remove('d-none');
            alertBox.classList.add('alert-danger');
        }
    });
</script>
</body>
</html>
